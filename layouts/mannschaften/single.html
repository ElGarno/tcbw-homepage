{{ define "main" }}
<section class="section" style="padding-top: 120px;">
  <div class="container" style="max-width: 760px;">
    <p class="label-upper section-eyebrow">Mannschaften</p>
    <h1 class="heading-display section-title">{{ .Title }}</h1>
    <p class="section-subtitle" style="margin-bottom: 32px;">{{ .Params.league }}</p>
    {{ with .Params.image }}
    <figure class="team-photo" style="margin: 0 0 32px; border-radius: var(--radius-lg); overflow: hidden;">
      <img src="{{ . }}" alt="{{ $.Params.image_alt | default $.Title }}" loading="lazy" style="width: 100%; height: auto; display: block;">
    </figure>
    {{ end }}
    <div style="font-size: 1.05rem; line-height: 1.8; color: var(--gray-600);">
      {{ .Content }}
    </div>
    {{ with .Params.liga_url }}
    <div style="margin-top: 32px;">
      <a href="{{ . }}" target="_blank" rel="noopener" class="btn btn-primary" style="background: var(--blue-600); color: var(--white);">
        Ergebnisse &amp; Tabelle auf liga.nu &#8599;
      </a>
    </div>
    {{ end }}
    <div style="margin-top: 24px;">
      <a href="/mannschaften/" class="btn-secondary">&larr; Alle Mannschaften</a>
    </div>
  </div>
</section>
{{ end }}
