{{ with .Params.schnupperjahr }}
<section class="section schnupperjahr-section" id="schnupperjahr">
  <div class="container">
    <div class="schnupperjahr-banner reveal">
      <div class="schnupperjahr-icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M 4.93 4.93 a 14 14 0 0 0 14.14 14.14"/>
          <path d="M 4.93 19.07 a 14 14 0 0 1 14.14 -14.14"/>
        </svg>
      </div>
      <div class="schnupperjahr-body">
        <p class="label-upper schnupperjahr-eyebrow">{{ .eyebrow }}</p>
        <h2 class="heading-display schnupperjahr-title">{{ .title }}</h2>
        <p class="schnupperjahr-text">{{ .text | markdownify }}</p>
        <a href="{{ .button_url }}" class="schnupperjahr-button">
          {{ .button_text }}
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </a>
      </div>
    </div>
  </div>
</section>
{{ end }}
