{{ define "main" }}
<section class="section" style="padding-top: 120px; padding-bottom: 80px;">
  <div class="container" style="max-width: 760px;">
    <div class="section-header" style="margin-bottom: 56px;">
      <h1 class="heading-display section-title">{{ .Title }}</h1>
      {{ with .Description }}<p class="section-subtitle">{{ . }}</p>{{ end }}
    </div>

    <div class="training-content">
      {{ .Content }}
    </div>

    {{ partial "contact-card.html" .Params.contact_section }}
  </div>
</section>

<style>
  .training-content { font-size: 1.05rem; line-height: 1.8; color: var(--gray-600); }
  .training-content h2 {
    color: var(--blue-800);
    font-size: 1.6rem;
    font-weight: 700;
    margin-top: 56px;
    margin-bottom: 16px;
    line-height: 1.3;
  }
  .training-content h2:first-child { margin-top: 0; }
  .training-content p { margin-bottom: 16px; }
  .training-content a {
    color: var(--blue-600);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }
  .training-content a:hover { color: var(--blue-700); }

  @media (max-width: 560px) {
    .training-content h2 { font-size: 1.4rem; margin-top: 44px; }
  }
</style>
{{ end }}
