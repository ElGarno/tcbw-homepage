{{ define "main" }}
<section class="section" style="padding-top: 120px; padding-bottom: 80px;">
  <div class="container" style="max-width: 760px;">
    <div class="section-header" style="margin-bottom: 56px;">
      <h1 class="heading-display section-title">{{ .Title }}</h1>
      {{ with .Description }}<p class="section-subtitle">{{ . }}</p>{{ end }}
    </div>

    <div class="training-content">
      {{ .Content }}
    </div>

    {{ with .Params.contact_section }}
    <aside class="training-contact-card" aria-label="Kontakt für individuelles Training">
      <div class="training-contact-card__icon" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <div class="training-contact-card__body">
        <h2 class="training-contact-card__title">{{ .heading }}</h2>
        <p class="training-contact-card__text">{{ .body }}</p>
        <a href="mailto:{{ .email }}" class="training-contact-card__cta">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <span>{{ .email }}</span>
        </a>
      </div>
    </aside>
    {{ end }}
  </div>
</section>

<style>
  .training-content { font-size: 1.05rem; line-height: 1.8; color: var(--gray-600); }
  .training-content h2 {
    color: var(--blue-800);
    font-size: 1.6rem;
    font-weight: 700;
    margin-top: 56px;
    margin-bottom: 16px;
    line-height: 1.3;
  }
  .training-content h2:first-child { margin-top: 0; }
  .training-content p { margin-bottom: 16px; }
  .training-content a {
    color: var(--blue-600);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }
  .training-content a:hover { color: var(--blue-700); }

  .training-contact-card {
    margin-top: 72px;
    display: flex;
    gap: 24px;
    align-items: flex-start;
    padding: 32px;
    background: linear-gradient(135deg, var(--blue-50) 0%, #ffffff 100%);
    border: 1px solid var(--blue-100);
    border-left: 4px solid var(--blue-500);
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(26, 64, 128, 0.06);
  }
  .training-contact-card__icon {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: var(--blue-500);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .training-contact-card__body { flex: 1; min-width: 0; }
  .training-contact-card__title {
    color: var(--blue-800);
    font-size: 1.35rem;
    font-weight: 700;
    margin: 0 0 12px 0;
    line-height: 1.3;
  }
  .training-contact-card__text {
    color: var(--gray-600);
    line-height: 1.7;
    margin: 0 0 20px 0;
  }
  .training-contact-card__cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    background: var(--blue-600);
    color: white;
    font-weight: 600;
    text-decoration: none;
    border-radius: 10px;
    transition: var(--transition, all 0.2s ease);
    word-break: break-all;
  }
  .training-contact-card__cta:hover {
    background: var(--blue-700);
    transform: translateY(-1px);
  }

  @media (max-width: 560px) {
    .training-contact-card { flex-direction: column; gap: 16px; padding: 24px; }
    .training-contact-card__icon { width: 48px; height: 48px; }
    .training-content h2 { font-size: 1.4rem; margin-top: 44px; }
  }
</style>
{{ end }}
